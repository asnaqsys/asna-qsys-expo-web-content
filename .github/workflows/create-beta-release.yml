name: Create Beta Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Create Beta Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Print ref info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "GITHUB_REF_NAME=${{ github.ref_name }}"
          echo "GITHUB_SHA=${{ github.sha }}"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}

      - name: Checkout DevOps repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DEVOPS_REPO }}
          token: ${{ secrets.DEVOPS_PAT }}
          path: devops
          fetch-depth: 1

      - name: Get the build version
        uses: ./devops/actions/get-build-version
        id: build_version
        with:
          version-file: ./${{ github.event.repository.name }}/.github/Directory.Build.props

      - name: Create the beta release
        uses: ./devops/actions/publish-release
        id: release
        with:
          tag: ${{ steps.build_version.outputs.build-version }}-beta
          target: ${{ github.sha }}
          prerelease: "true"
          token: ${{ github.token }}

      - name: Purge the CDN
        # Content stays cached per tag, so the release is not live until this
        # runs. Doing it here rather than on a release event means it cannot be
        # forgotten, and does not depend on which token created the release.
        uses: ./devops/actions/purge-jsdelivr
        with:
          tag: ${{ steps.release.outputs.tag }}
          token: ${{ github.token }}
