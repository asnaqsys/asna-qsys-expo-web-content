name: Purge release

# Dispatch only. The release workflows purge the tag they create, so a release
# event here would purge everything a second time. This exists for the cases
# they cannot cover: a purge that failed after its release was published and
# cannot be re-run from that workflow, an older tag reported as stale, or a
# partial purge against a rate limited service.
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to purge
        required: true

jobs:
  purge:
    name: Purge release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DevOps repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DEVOPS_REPO }}
          token: ${{ secrets.DEVOPS_PAT }}
          path: devops
          fetch-depth: 1

      - name: Purge the CDN
        uses: ./devops/actions/purge-jsdelivr
        with:
          tag: ${{ github.event.inputs.tag }}
          token: ${{ github.token }}
